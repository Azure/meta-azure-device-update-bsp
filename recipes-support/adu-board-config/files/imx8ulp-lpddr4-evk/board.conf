# ADU Board Configuration for NXP i.MX8ULP-LPDDR4-EVK
#
# This file defines board-specific partition paths and boot media.
# Sourced by adu-boot-validation.sh, yocto-a-b-update.sh, adu-setup-swap,
# and adu-confirm-boot. Each board layer installs its own version at
# /etc/adu/board.conf.

# Disk device (as seen by Linux)
ADU_DISK_DEVICE="/dev/mmcblk0"

# Root partition devices
ADU_ROOT_A_DEV="/dev/mmcblk0p2"
ADU_ROOT_B_DEV="/dev/mmcblk0p3"

# Data partition
ADU_DATA_DEV="/dev/mmcblk0p4"

# Boot partition mount point
ADU_BOOT_MOUNT="/boot"

# U-Boot boot media (as seen by U-Boot)
ADU_UBOOT_MEDIA="mmc"
ADU_UBOOT_DEVICE="0"
ADU_UBOOT_BOOT_PART="0:1"

# Partition identifiers for /proc/cmdline matching
ADU_CMDLINE_ROOT_A="root=/dev/mmcblk0p2"
ADU_CMDLINE_ROOT_B="root=/dev/mmcblk0p3"

# U-Boot environment location
# file: /boot/uboot.env (FAT file-backed)
ADU_UBOOT_ENV_TYPE="file"
ADU_UBOOT_ENV_FILE="/boot/uboot.env"

# Serial console (for diagnostics)
ADU_SERIAL_CONSOLE="ttyLP1"

# Max boot attempts before u-boot rolls back to LKG slot
ADU_MAX_BOOT_ATTEMPTS=5

# Swap file size in MiB for delta-update reconstruction.
# i.MX8ULP EVK ships with multi-GB eMMC; 1 GiB swap is adequate for bspatch.
ADU_SWAP_SIZE_MB=1024
