# ADU Persistent Overlay Configuration
# Controls which directories use overlayfs, which dirs use bind mounts, and
# which files are synced to/from /adu/system at boot and on change.

# Base directory for all persistent data
PERSIST_BASE="/adu"

# Overlay base directory (upper layers)
OVERLAY_BASE="${PERSIST_BASE}/overlay"

# Work directory for overlayfs
WORK_BASE="${PERSIST_BASE}/work"

# System directory for persistent files and bind-mounted directories
SYSTEM_DIR="${PERSIST_BASE}/system"

# Overlayfs targets (require CONFIG_OVERLAY_FS=y in kernel).
OVERLAY_DIRS=(
    "/var/log"
    "/var/lib/connman"
    "/var/lib/bluetooth"
    "/var/cache/apt"
    "/var/lib/adu"
    "/var/lib/adu/downloads"
    "/var/lib/adu/extensions"
    "/var/lib/adu/states"
    "/var/lib/adu/sdc"
    "/var/lib/adu/api"
)

# SYNC_FILES: individual files restored from /adu/system into /etc at boot
# (with 3-way merge for passwd/shadow/group/gshadow) and pushed back to
# /adu/system on change by adu-persistent-watcher.service.
#
# We CANNOT bind-mount these — shadow-utils tools (chpasswd, usermod, ...)
# write a temp file and rename() it over the target, which returns EBUSY
# against a bind-mount target.
#
# Format: source_basename:target_absolute_path
SYNC_FILES=(
    "passwd:/etc/passwd"
    "shadow:/etc/shadow"
    "group:/etc/group"
    "gshadow:/etc/gshadow"
    "hostname:/etc/hostname"
    "timezone:/etc/timezone"
    "machine-id:/etc/machine-id"
    "du-config.json:/etc/adu/du-config.json"
)

# BIND_MOUNTS: DIRECTORIES (and stable files not rewritten by atomic-rename
# tools) bind-mounted from /adu/system to their target. Atomic-rename WITHIN
# a bind-mounted directory is fine; only renaming OVER the mount point fails.
#
# SSH host keys are persisted via SYNC, not by bind-mounting /etc/ssh, so
# rootfs updates can change sshd_config / moduli without being shadowed.
#
# Format: source_basename:target_absolute_path
BIND_MOUNTS=(
    "apt-sources.list.d:/etc/apt/sources.list.d"
    "apt-trusted.gpg.d:/etc/apt/trusted.gpg.d"
    "apt-preferences.d:/etc/apt/preferences.d"
)

# Also sync these SSH host-key files under /etc/ssh -> /adu/system/ssh/.
# sshd_config, ssh_config, moduli are owned by the rootfs.
SSH_HOST_KEYS=(
    "ssh_host_rsa_key"
    "ssh_host_rsa_key.pub"
    "ssh_host_ed25519_key"
    "ssh_host_ed25519_key.pub"
    "ssh_host_ecdsa_key"
    "ssh_host_ecdsa_key.pub"
)

# Enable migration on first boot
AUTO_MIGRATE="yes"

# Enable verification after mount
VERIFY_MOUNTS="yes"

# Debounce window (seconds) for adu-persistent-watcher.
WATCHER_DEBOUNCE="1"