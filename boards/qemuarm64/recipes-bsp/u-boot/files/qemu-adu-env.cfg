# U-Boot configuration fragment for QEMU ADU persistent environment
# Enables saving environment to a file on the FAT boot partition via virtio

# Enable virtio support
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_CMD_VIRTIO=y

# Enable FAT filesystem support
CONFIG_FS_FAT=y
CONFIG_FS_FAT_MAX_CLUSTSIZE=65536
CONFIG_FAT_WRITE=y
CONFIG_CMD_FAT=y

# Enable environment stored in FAT file
CONFIG_ENV_IS_NOWHERE=n
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="virtio"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x4000

# Enable saveenv command
CONFIG_CMD_SAVEENV=y

# Enable boot scripting
CONFIG_CMD_SOURCE=y
CONFIG_CMD_BOOTD=y

# Enable setexpr for boot_attempts arithmetic
CONFIG_CMD_SETEXPR=y

# Enable partition commands
CONFIG_CMD_PART=y
CONFIG_PARTITIONS=y
CONFIG_EFI_PARTITION=y
CONFIG_PARTITION_UUIDS=y

# Enable booti (boot Image format)
CONFIG_CMD_BOOTI=y
