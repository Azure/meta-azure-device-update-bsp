# Layer configuration for meta-azure-device-update-bsp
#
# Consolidated BSP integration layer for Azure Device Update (ADU).
# Provides board-specific recipes for multiple hardware targets:
#   - Raspberry Pi 4 (via dynamic-layers/raspberrypi/)
#   - QEMU arm64 (via boards/qemuarm64/)
#   - NXP i.MX8ULP EVK (via dynamic-layers/freescale/)
#
# Board-specific recipes that depend on optional BSP layers are loaded
# conditionally via BBFILES_DYNAMIC so that only the relevant board's
# recipes are parsed.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Shared recipes (always parsed)
BBFILES += " \
    ${LAYERDIR}/recipes-*/**/*.bb \
    ${LAYERDIR}/recipes-*/**/*.bbappend \
    ${LAYERDIR}/boards/qemuarm64/recipes-*/**/*.bb \
    ${LAYERDIR}/boards/qemuarm64/recipes-*/**/*.bbappend \
"

# Board-specific recipes loaded only when the matching BSP layer is present
BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/**/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/**/*.bbappend \
    freescale-layer:${LAYERDIR}/dynamic-layers/freescale/recipes-*/**/*.bb \
    freescale-layer:${LAYERDIR}/dynamic-layers/freescale/recipes-*/**/*.bbappend \
"

BBFILE_COLLECTIONS += "azure-device-update-bsp"
BBFILE_PATTERN_azure-device-update-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_azure-device-update-bsp = "17"

LAYERDEPENDS_azure-device-update-bsp = " \
    core \
    openembedded-layer \
    swupdate \
    azure-device-update \
"

LAYERSERIES_COMPAT_azure-device-update-bsp = "scarthgap"

# ---- QEMU board defaults ----
ADU_MANUFACTURER:qemuarm64 ?= "QEMU"
ADU_MODEL:qemuarm64 ?= "virt-aarch64"

# ---- i.MX8ULP board defaults ----
ADU_MANUFACTURER:imx8ulp-lpddr4-evk ?= "Contoso"
ADU_MODEL:imx8ulp-lpddr4-evk ?= "i.MX8ULP-EVK"
